<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LDP Fleet Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#f7f6f3;--panel:#fff;--ink:#1a1a1c;--sub:#5f5d58;--line:#e2dfd8;--gold:#b8860b;
  --on:#1e9e4a;--idle:#d39b00;--off:#8d8a83;--you:#2f6fdc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111214;--panel:#1b1c1f;--ink:#ecebe6;--sub:#a5a39c;--line:#2e2f33;--gold:#e8b84b;--off:#6f6d68}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
header h1{font-size:16px;margin:0;letter-spacing:.02em}header h1 b{color:var(--gold)}
.counts{display:flex;gap:10px;font-size:13px;color:var(--sub)}.counts span{white-space:nowrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:0}
#upd{margin-left:auto;font-size:12px;color:var(--sub);white-space:nowrap}
main{flex:1;display:flex;min-height:0}
#list{width:330px;flex:none;overflow:auto;background:var(--panel);border-right:1px solid var(--line)}
#map{flex:1;min-width:0}
.grp{padding:10px 14px 4px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--sub)}
.row{display:flex;gap:10px;padding:9px 14px;border-top:1px solid var(--line);cursor:pointer;align-items:flex-start}
.row:hover{background:color-mix(in srgb,var(--gold) 8%,transparent)}
.row .mk{margin-top:3px;flex:none}.row .t{flex:1;min-width:0}.row b{display:block;overflow-wrap:anywhere}
.row small{display:block;color:var(--sub)}.row .st{font-size:12px;color:var(--sub);white-space:nowrap}
.mk{width:12px;height:12px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.mk.ctl{border-radius:3px;width:14px;height:14px}
.pin{width:18px;height:18px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45)}
.pin.ctl{border-radius:4px;width:20px;height:20px}
.pin.approx{border-style:dashed}
.on{background:var(--on)}.idle{background:var(--idle)}.off{background:var(--off)}
.leaflet-popup-content{margin:12px 14px;font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-width:220px}
.pp h3{margin:0 0 2px;font-size:15px}.pp .s{margin:0 0 8px;color:#555}.pp dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.pp dt{color:#777}.pp dd{margin:0;overflow-wrap:anywhere}.pp .links{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.pp .links a{padding:4px 9px;border:1px solid #b8860b;border-radius:6px;color:#7a5800;text-decoration:none;font-weight:600}
.pp .warn{color:#9a5b00;font-size:12px;margin-top:6px}
#toggle{display:none}
#err{display:none;position:absolute;z-index:1000;top:70px;left:50%;transform:translateX(-50%);background:#b3261e;color:#fff;padding:8px 12px;border-radius:8px;max-width:90vw}
@media (max-width:760px){
  header{flex-wrap:wrap;gap:6px 12px}#upd{margin-left:0}
  main{flex-direction:column-reverse}
  #list{width:auto;max-height:42vh;border-right:0;border-top:1px solid var(--line)}
  #list.min{max-height:0;overflow:hidden;border:0}
  #toggle{display:inline-block;margin-left:auto;padding:5px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font:inherit}
}
</style>
</head>
<body>
<header>
  <h1><b>LDP</b> Fleet</h1>
  <div class="counts" id="counts"></div>
  <span id="upd">loading…</span>
  <button id="toggle" type="button">List</button>
</header>
<main>
  <div id="list"></div>
  <div id="map"></div>
</main>
<div id="err"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function () {
  var map = L.map('map', { zoomControl: true, worldCopyJump: true }).setView([39.8, -89.6], 5);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    { maxZoom: 19, attribution: '&copy; OpenStreetMap contributors' }).addTo(map);
  var layer = L.layerGroup().addTo(map), markers = {}, first = true;

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = String(text); return e; }
  function ago(s) {
    if (s == null) return '';
    if (s < 90) return s + ' s ago'; if (s < 5400) return Math.round(s / 60) + ' min ago';
    if (s < 172800) return Math.round(s / 3600) + ' h ago'; return Math.round(s / 86400) + ' days ago';
  }
  function state(d) { return d.online ? (d.active || d.self ? 'on' : 'idle') : 'off'; }
  function stateText(d) {
    if (d.self) return 'Online (this PC)';
    if (d.online) return d.active ? 'Online · active' : 'Online · idle';
    return 'Offline' + (d.lastSeenAgo != null ? ' · last seen ' + ago(d.lastSeenAgo) : '');
  }
  function kind(d) {
    if (d.controller) return 'Controller';
    var os = (d.os || '').toLowerCase();
    return os === 'android' || os === 'ios' ? 'Phone' : os === 'windows' || os === 'macos' ? 'Computer' : (d.os || 'Device');
  }

  function popup(d) {
    var w = el('div', 'pp');
    w.appendChild(el('h3', null, d.name));
    w.appendChild(el('p', 's', stateText(d)));
    var dl = el('dl');
    function row(k, v) { if (!v) return; dl.appendChild(el('dt', null, k)); dl.appendChild(el('dd', null, v)); }
    row('What', d.role || kind(d));
    row('Customer', d.customer);
    row('Where', d.location ? (d.location.place || (d.location.lat.toFixed(3) + ', ' + d.location.lng.toFixed(3))) : 'unknown');
    row('Placed by', d.location ? d.location.source + (d.location.approx ? ' (approximate)' : '') : '');
    row('Tailscale', d.ip + (d.host && d.host.toLowerCase() !== d.name.toLowerCase() ? '  ·  ' + d.host : ''));
    w.appendChild(dl);
    var links = el('div', 'links');
    function link(text, href) { var a = el('a', null, text); a.href = href; a.target = '_blank'; a.rel = 'noopener'; links.appendChild(a); }
    if (d.controller && d.ip) {
      link('Open FPP', 'http://' + d.ip + '/');
      link('Port Map', 'http://' + d.ip + '/plugin.php?plugin=fpp-ldp-remote-support&page=portmap.php&nopage=1');
    }
    Object.keys(d.links || {}).forEach(function (k) { var u = String(d.links[k]); if (/^https?:\/\//i.test(u)) link(k, u); });
    if (links.childNodes.length) w.appendChild(links);
    if (d.controller && !d.online) w.appendChild(el('div', 'warn', 'Offline — links work once it reconnects.'));
    if (d.location && d.location.approx) w.appendChild(el('div', 'warn', 'Approximate pin — add its address in units.json for an exact spot.'));
    return w;
  }

  function spread(devs) {
    // fan out devices that share (nearly) the same spot so every pin is clickable
    var groups = {};
    devs.forEach(function (d) { if (!d.location) return; var k = d.location.lat.toFixed(3) + ',' + d.location.lng.toFixed(3); (groups[k] = groups[k] || []).push(d); });
    Object.keys(groups).forEach(function (k) {
      var g = groups[k]; if (g.length < 2) { g[0]._ll = [g[0].location.lat, g[0].location.lng]; return; }
      g.forEach(function (d, i) {
        var a = 2 * Math.PI * i / g.length, r = 0.0012 + 0.0002 * g.length;
        d._ll = [d.location.lat + r * Math.sin(a), d.location.lng + r * 1.3 * Math.cos(a)];
      });
    });
  }

  function render(data) {
    var devs = data.devices || [];
    devs.sort(function (a, b) { return (b.controller - a.controller) || (b.online - a.online) || a.name.localeCompare(b.name); });
    spread(devs);
    layer.clearLayers();
    var bounds = [], on = 0, off = 0, list = document.getElementById('list');
    list.textContent = '';
    var groups = [['Controllers', devs.filter(function (d) { return d.controller; })],
                  ['Your devices', devs.filter(function (d) { return !d.controller; })]];
    groups.forEach(function (g) {
      if (!g[1].length) return;
      list.appendChild(el('div', 'grp', g[0] + ' · ' + g[1].length));
      g[1].forEach(function (d) {
        d.online ? on++ : off++;
        var st = state(d), cls = (d.controller ? 'ctl ' : '') + st;
        var m = null;
        if (d._ll) {
          var icon = L.divIcon({ className: '', html: '<div class="pin ' + cls + (d.location.approx ? ' approx' : '') + '"></div>',
                                 iconSize: [22, 22], iconAnchor: [11, 11], popupAnchor: [0, -10] });
          m = L.marker(d._ll, { icon: icon, title: d.name, zIndexOffset: d.controller ? 1000 : 0 }).addTo(layer);
          m.bindPopup(popup(d)); bounds.push(d._ll);
        }
        var r = el('div', 'row');
        var mk = el('span', 'mk ' + cls); r.appendChild(mk);
        var t = el('div', 't'); t.appendChild(el('b', null, d.name));
        t.appendChild(el('small', null, d.role || kind(d)));
        t.appendChild(el('small', null, d.location ? (d.location.place || '') + (d.location.approx ? ' (approx.)' : '')
          : 'No location yet' + (d.hint ? ' · relay: ' + d.hint : '') + ' — add address'));
        r.appendChild(t);
        r.appendChild(el('span', 'st', d.online ? (d.self ? 'this PC' : 'online') : (d.lastSeenAgo != null ? ago(d.lastSeenAgo) : 'offline')));
        r.addEventListener('click', function () {
          if (m) { map.setView(m.getLatLng(), Math.max(map.getZoom(), 12)); m.openPopup(); }
          if (window.innerWidth <= 760) document.getElementById('list').classList.add('min');
        });
        list.appendChild(r);
      });
    });
    var c = document.getElementById('counts'); c.textContent = '';
    var a = el('span'); a.appendChild(el('span', 'dot on')); a.appendChild(document.createTextNode(on + ' online')); c.appendChild(a);
    var b = el('span'); b.appendChild(el('span', 'dot off')); b.appendChild(document.createTextNode(off + ' offline')); c.appendChild(b);
    document.getElementById('upd').textContent = 'Updated ' + (data.generated || '').slice(11, 16);
    if (first && bounds.length) { map.fitBounds(bounds, { padding: [40, 40], maxZoom: 11 }); first = false; }
  }

  function load() {
    fetch('/api/devices', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (d) {
      var e = document.getElementById('err');
      if (d.error) { e.textContent = 'Tailscale status failed: ' + d.error; e.style.display = 'block'; return; }
      e.style.display = 'none'; render(d);
    }).catch(function () {
      var e = document.getElementById('err'); e.textContent = 'Can’t reach the fleet map server — is the PC on and Tailscale connected?'; e.style.display = 'block';
    });
  }
  document.getElementById('toggle').addEventListener('click', function () {
    document.getElementById('list').classList.toggle('min'); setTimeout(function () { map.invalidateSize(); }, 50);
  });
  load(); setInterval(load, 30000);
})();
</script>
</body>
</html>
